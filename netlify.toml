[build]
  command = "python3 build_seo.py && python3 build_ai_knowledge.py && python3 verify_seo.py"
  publish = "site"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Netlify's URL supplies the canonical origin and sitemap. Production builds also add the
# owner-provided Auto ads loader and ads.txt; branch/deploy previews remain ad-free/noindex.
# The public publisher ID is in build_seo.py and is not a secret; CONTACT_EMAIL can override the public email.

# AdSense requires nonce-based CSP support. This plugin adds a fresh nonce to HTML scripts
# and the matching response header at the Netlify edge; it does not deploy or publish the site by itself.
[[plugins]]
  package = "@netlify/plugin-csp-nonce"
  [plugins.inputs]
    reportOnly = false
    strictDynamic = true
    unsafeEval = true
    unsafeInline = true
    self = true
    https = true
    http = true

# Browser hardening for the public static atlas, with the Google endpoints needed for
# Auto ads and Privacy & Messaging CMP. Script execution is nonce/strict-dynamic managed above.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow, max-image-preview:large"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https: http:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com https://*.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.mymemory.translated.net https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com https://*.adtrafficquality.google https://fundingchoicesmessages.google.com; frame-src 'self' https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com https://*.adtrafficquality.google https://fundingchoicesmessages.google.com; upgrade-insecure-requests"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Versioned first-party assets (?v=N) can be cached forever; HTML must revalidate.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js.map"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css.map"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Unversioned data files get a short revalidation window plus stale-while-revalidate
# so they stay correct across deploys and still avoid a cold fetch on repeat visits.
[[headers]]
  for = "/bot-knowledge.json"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/blog-studio.html"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

