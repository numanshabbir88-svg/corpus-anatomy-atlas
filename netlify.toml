# === AGENT DISCOVERY PATHS ===
# /.well-known/* is reserved for machine-readable discovery documents. The site has no
# MCP/A2A/skill catalog to publish, so these paths must answer with a real 404 instead of
# falling through to the app shell: the SPA rewrite would serve index.html with a 200 and
# Lighthouse's Agentic Browsing audit (ard-schema) reads that HTML as a broken ARD manifest.
[[redirects]]
  from = "/.well-known/*"
  to = "/404.html"
  status = 404

# === HASHLESS INTERACTIVE CHAPTER ROUTES (SPA 200 REWRITE) ===
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

