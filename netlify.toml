[build]
  command = "python3 build_seo.py && python3 verify_seo.py"
  publish = "site"

# The Netlify-provided URL build variable supplies the canonical origin and sitemap.
# The user-supplied public email is already on About/Privacy; CONTACT_EMAIL can override it.
# Do not add ad code or a made-up AdSense publisher ID to this configuration.

# Basic browser hardening for the public, static atlas. No accounts or private pages.
# CSP intentionally permits inline CSS and structured-data markup used by the current site.
# If ads, analytics or third-party embeds are ever added, review/test this policy first.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://upload.wikimedia.org https://thumb.wikimedia.org https://*.wikimedia.org https://*.wikipedia.org; font-src 'self' data:; connect-src 'self' https://en.wikipedia.org https://*.wikipedia.org https://www.wikidata.org https://api.mymemory.translated.net; upgrade-insecure-requests"
